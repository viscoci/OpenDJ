services:
  app:
    build:
      context: ../..
      dockerfile: apps/oss-demo/Dockerfile
    image: opendj-oss-demo:dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opendj
      BASE_URL: http://localhost:8888
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8888/api/v1/provider/connections/spotify/callback}
      MAX_SONGS_PER_GUEST: ${MAX_SONGS_PER_GUEST:-3}
      MODERATION_ENABLED_DEFAULT: ${MODERATION_ENABLED_DEFAULT:-false}
      # VALKEY_URL: redis://valkey:6379  # uncomment if running multi-container OSS
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8888:8888'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opendj
    volumes:
      - opendj-postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional: enable when running more than one app container
  # valkey:
  #   image: valkey/valkey:8-alpine
  #   ports:
  #     - '6379:6379'
  #   restart: unless-stopped

volumes:
  opendj-postgres:
