name: Feature request
description: Suggest an enhancement to OpenDJ
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before filing, please check [Discussions](https://github.com/viscoci/opendj/discussions) — open-ended ideas often start there.

        **Commercial-only features** (Branding Studio, billing, product analytics dashboards, native mobile shells) are out of scope for this repo — see [`docs/REPO_BOUNDARY.md`](../../docs/REPO_BOUNDARY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What's the user / developer pain you're solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you change OpenDJ? Include API surface, file paths, package boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - 'Single package (which?)'
        - 'Multiple packages'
        - 'Tooling / CI'
        - 'Docs only'
        - 'Unsure'
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
